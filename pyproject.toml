[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bryce3d-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents drive MetaCreations Bryce 3D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bryce3d-mcp = "bryce3d_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
