[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bryce3d-mcp"
version = "0.14.0"
description = "MCP server that lets AI agents build and edit MetaCreations Bryce 3D scenes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bryce3d-mcp = "bryce3d_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bryce3d_mcp = ["bin/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
